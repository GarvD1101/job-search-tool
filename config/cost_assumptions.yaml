# Cost and scale assumptions for Fresher Radar pipeline and web serving
# Last verified: 2026-11-19

measured_pipeline_metrics:
  # Measured from live production database (llm_calls and jobs tables)
  survivor_rate: 0.5535 # 1,127 survivors / 2,036 total raw posts
  rejection_rate: 0.4465 # 820 rule rejected + 89 duplicate / 2,036
  avg_batch_size: 10 # 10 posts per LLM API call

  models:
    openai/gpt-oss-20b:
      input_tokens_per_post: 218.25
      output_tokens_per_post: 73.68 # Includes 44.20 reasoning tokens
      reasoning_tokens_per_post: 44.20
      input_price_per_1m: 0.075
      output_price_per_1m: 0.30
      pricing_type: "published list price"
      source_url: "https://groq.com/pricing/"
      last_verified: "2026-11-19"

    openai/gpt-oss-120b:
      input_tokens_per_post: 215.22
      output_tokens_per_post: 74.76 # Includes 45.69 reasoning tokens
      reasoning_tokens_per_post: 45.69
      input_price_per_1m: 0.15
      output_price_per_1m: 0.60
      pricing_type: "published list price"
      source_url: "https://groq.com/pricing/"
      last_verified: "2026-11-19"

    qwen/qwen3.8-27b:
      input_tokens_per_post: 237.29
      output_tokens_per_post: 56.71 # No reasoning tokens
      reasoning_tokens_per_post: 0.00
      input_price_per_1m: 0.80
      output_price_per_1m: 4.00
      pricing_type: "published list price"
      source_url: "https://groq.com/pricing/"
      last_verified: "2026-11-19"

pipeline_volume_scenarios:
  low:
    raw_posts_per_day: 200
    description: "Off-peak or weekend volume"
  baseline:
    raw_posts_per_day: 600
    description: "Normal daily fresher posting volume from Jooble and Greenhouse"
  high:
    raw_posts_per_day: 2000
    description: "Peak hiring season with expanded board coverage"

serving_traffic_assumptions:
  searches_per_user_day: 5
  cdn_cache_hit_rate_baseline: 0.90
  cdn_cache_hit_rate_sensitivity: 0.50
  avg_response_payload_kb: 10
  commercial_note: "Vercel Hobby and Supabase Free are for personal, non-commercial use only. Commercial launches require Pro tiers."

serving_pricing_tiers:
  supabase:
    source_url: "https://supabase.com/pricing"
    last_verified: "2026-11-19"
    tiers:
      free:
        price_per_month: 0.0
        pricing_type: "published list price (non-commercial only)"
        max_db_size_mb: 500
        max_egress_gb_per_month: 5.0
        max_connections: 200
        suitable_up_to_dau: 1000
        note: "Pauses after 1 week inactivity. Free tier egress covers 10k users at 90% CDN, but lacks commercial SLA."
      pro:
        price_per_month: 25.0
        pricing_type: "published list price"
        included_db_size_gb: 8.0
        included_egress_gb_per_month: 250.0
        egress_overage_per_gb: 0.09
        max_connections: 10000
        suitable_up_to_dau: 50000
      pro_with_medium_compute:
        price_per_month: 85.0 # $25 base + $60 Medium compute addon
        pricing_type: "published list price"
        included_db_size_gb: 8.0
        included_egress_gb_per_month: 250.0
        max_connections: 10000
        suitable_up_to_dau: 100000
        note: "Required when 50% CDN hit ratio generates 7.5M origin queries/month."
      team:
        price_per_month: 599.0
        pricing_type: "published list price"
        included_db_size_gb: 16.0
        included_egress_gb_per_month: 250.0
        max_connections: 10000
        suitable_up_to_dau: 1000000
      enterprise:
        price_per_month: null
        pricing_type: "contact sales"
        note: "Custom enterprise contract required for high-throughput multi-region clusters."

  vercel:
    source_url: "https://vercel.com/pricing"
    last_verified: "2026-11-19"
    tiers:
      hobby:
        price_per_month: 0.0
        pricing_type: "published list price (non-commercial only)"
        included_bandwidth_gb_per_month: 100.0
        suitable_up_to_dau: 1000
        note: "Personal projects only. Not licensed for commercial production."
      pro:
        price_per_month: 20.0 # 1 team seat
        pricing_type: "published list price"
        included_edge_requests: 10000000 # 10M
        included_function_invocations: 1000000 # 1M
        included_bandwidth_tb_per_month: 1.0 # 1 TB
        edge_request_overage_per_1m: 2.00
        function_invocation_overage_per_1m: 0.40
        bandwidth_overage_per_gb: 0.15
        suitable_up_to_dau: 50000
      enterprise:
        price_per_month: null
        pricing_type: "contact sales"
        note: "Custom contract required beyond self-serve thresholds (>10M edge requests or custom SLA)."
