# Source configuration and compliance limits
# Sources: Jooble API (primary), Greenhouse public boards (secondary)

sources:
  jooble:
    enabled: true
    type: "api"
    base_url: "https://jooble.org/api"
    daily_budget_total: 100
    daily_budget_cron: 60
    daily_budget_dev: 40
    usage_counter_file: "data/usage_counter.json"
    user_agent: "fresher-radar/0.1 ({contact_email})"
    rate_limit:
      requests_per_minute: 10
      retry_backoff_factor: 2
      max_retries: 3
    search_queries:
      terms:
        - "fresher"
        - "intern"
        - "internship"
        - "graduate trainee"
        - "entry level"
        - "campus hiring"
        - "0-1 years"
      locations:
        - "India"
        - "Bengaluru"
        - "Hyderabad"
        - "Pune"
        - "Mumbai"
        - "Delhi"
        - "Chennai"
        - "Kolkata"

  greenhouse:
    enabled: true
    type: "ats_board"
    daily_budget_total: 50
    user_agent: "fresher-radar/0.1 ({contact_email})"
    # List of Indian-hiring company tokens on Greenhouse will be populated in Phase 1
    companies: []
