# Source configuration and compliance limits
# Sources: Jooble API (primary), Greenhouse public boards (secondary)

sources:
  jooble:
    enabled: true
    type: "api"
    base_url: "https://in.jooble.org/api"
    daily_budget_total: 100
    daily_budget_cron: 60
    daily_budget_dev: 40
    usage_counter_file: "data/usage_counter.json"
    cache_dir: "data/cache/jooble"
    user_agent: "fresher-radar/0.1 ({contact_email})"
    rate_limit:
      requests_per_minute: 10
      retry_backoff_factor: 2
      max_retries: 3
      polite_delay_seconds: 0.5
    search_queries:
      terms:
        - "fresher"
        - "intern"
        - "internship"
        - "graduate trainee"
        - "entry level"
        - "campus hiring"
      locations:
        - "India"
        - "Bengaluru"
        - "Hyderabad"
        - "Pune"
        - "Mumbai"
        - "Delhi"
        - "Chennai"
        - "Kolkata"

  greenhouse:
    enabled: true
    type: "ats_board"
    base_url: "https://boards-api.greenhouse.io/v1/boards"
    cache_dir: "data/cache/greenhouse"
    user_agent: "fresher-radar/0.1 ({contact_email})"
    rate_limit:
      requests_per_minute: 30
      retry_backoff_factor: 2
      max_retries: 3
      polite_delay_seconds: 0.2
    # Verified company boards with confirmed India or India-open remote postings
    companies:
      - "druva"
      - "slice"
      - "deliveroo"
      - "okta"
      - "twilio"
      - "inmobi"
      - "groww"
      - "elastic"
      - "mongodb"
      - "stripe"
      - "affirm"
      - "datadog"
      - "intercom"
      - "samsara"
      - "rubrik"
      - "gitlab"
      - "coinbase"
      - "dropbox"
      - "pagerduty"
      - "sumologic"
      - "zscaler"
      - "databricks"
      - "gusto"
      - "brex"
      - "checkr"
      - "grafanalabs"
      - "instacart"
      - "reddit"
      - "roblox"
      - "pinterest"
      - "figma"
      - "airtable"
