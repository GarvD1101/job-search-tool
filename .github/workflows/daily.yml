name: Daily Refresh Pipeline

on:
  schedule:
    # 03:30 UTC = 09:00 IST every day
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      sources:
        description: "Sources to fetch (comma-separated: jooble, greenhouse)"
        required: false
        default: "jooble,greenhouse"

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  refresh:
    name: Fetch and Filter Jobs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Fetch Stage
        run: |
          TRIGGER="${{ github.event_name == 'schedule' && 'schedule' || 'manual' }}"
          SOURCES="${{ github.event.inputs.sources || 'jooble,greenhouse' }}"
          python -m pipeline.run --stage fetch --mode cron --sources "$SOURCES" --trigger "$TRIGGER"

      - name: Run Filter Stage
        run: |
          TRIGGER="${{ github.event_name == 'schedule' && 'schedule' || 'manual' }}"
          python -m pipeline.run --stage filter --trigger "$TRIGGER"

      - name: Run Tag Stage
        run: |
          python -m pipeline.run --stage tag --model "${TAG_MODEL:-openai/gpt-oss-20b}"

